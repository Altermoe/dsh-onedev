# dsh-onedev bundle patch.
# Applied when this package is mounted as a DSH profile bundle. It inserts the
# dsh-onedev host plugin (loopback config/probe surface served to the Web GUI)
# and attaches the dsh-onedev-mcp server through the standard @deepseek-ai MCP
# client bridge. The server reads its credentials from the credential store
# written by the OneDev settings tab, so no env vars are injected here.
- insert:
    - id: dsh-onedev
      name: 'dsh-onedev'
      config: {}

- insert:
    - id: dsh-onedev-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: onedev
        transport: stdio
        command: node
        # The launcher is resolved from this bundle's own install location
        # (the profile's node_modules, where pnpm links every installed bundle)
        # instead of a machine-specific absolute path: `ctx.get('profileContext')`
        # is the launcher-provided profile, available to every `!!js` expression.
        args:
          - !!js "(ctx.get('profileContext')?.dir ?? process.cwd()) + '/node_modules/dsh-onedev/bin/dsh-onedev-mcp.mjs'"
        env: {}
        toolCallTimeoutMs: 60000
        failOnStartupError: false